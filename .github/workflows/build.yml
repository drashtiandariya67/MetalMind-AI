name: Build Android APK (Fast)

on:
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build APK locally on GitHub servers (Bypass Queue)
        run: eas build -p android --profile preview --local --non-interactive --output app-build.apk

      - name: Upload APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: MetalMind-AI-App
          path: app-build.apk
